services:
  - type: web
    name: checkpoint-backend
    runtime: node
    plan: free
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start:prod
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: API_PREFIX
        value: api/v1
      - key: CORS_ORIGIN
        value: "*"
      - key: MONGODB_COLLECTION
        value: food_database
      - key: SCAN_CACHE_COLLECTION
        value: scan_cache
      - key: GEMINI_MODEL
        value: gemini-3-flash-preview
      - key: MONGODB_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
