name: Build Android APK

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android:
    name: Build & Package Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Install Frontend Dependencies
        working-directory: frontend
        run: npm install

      - name: Build Web Assets (Vite)
        working-directory: frontend
        run: npm run build

      - name: Sync with Capacitor Android
        working-directory: frontend
        run: npx cap sync android

      - name: Make Gradle Wrapper Executable
        working-directory: frontend/android
        run: chmod +x gradlew

      - name: Build Android Debug APK
        working-directory: frontend/android
        run: ./gradlew assembleDebug --stacktrace

      - name: Upload Android Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: CheckPoint-Debug-APK
          path: frontend/android/app/build/outputs/apk/debug/*.apk
          retention-days: 14
